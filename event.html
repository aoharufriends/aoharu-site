<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT INFO | 私立青春学園 超文化祭2026</title>
    <link rel="icon" type="image/png" href="logo_icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kanit:ital,wght@1,900&family=Teko:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* =========================================
           ▼ CORE STYLES
           ========================================= */
        :root {
            --bg-core: #050505;
            --primary: #00f0ff;
            --accent: #ff0055;
            --yellow: #fcee0a;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --font-jp-head: 'Dela Gothic One', sans-serif;
            --font-en: 'Teko', sans-serif;
            --font-body: 'Zen Kaku Gothic New', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-core);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }
        .bg-grid-base {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -10; pointer-events: none;
        }
        
        /* 基本コンテナ（画面幅いっぱい使う用＝参加者一覧など） */
        .container { 
            max-width: 95%; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        /* ▼▼▼ 幅を狭くする用のクラス (NEW!) ▼▼▼ */
        /* 協賛・ギャラリー・クレジット用 */
        .narrow-box {
            max-width: 1000px !important; /* ここで幅を制限！ */
            margin-left: auto;
            margin-right: auto;
        }

        .section-header { text-align: center; margin: 100px auto 60px; position: relative; }
        .section-en {
            font-family: var(--font-en); font-size: clamp(4rem, 10vw, 8rem); font-weight: 700;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0));
            -webkit-background-clip: text; color: transparent;
            -webkit-text-stroke: 1px rgba(0,240,255,0.3);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: -1; white-space: nowrap; pointer-events: none;
        }
        .section-jp {
            font-family: var(--font-jp-head); font-size: clamp(2rem, 5vw, 3rem);
            color: var(--text-main); text-shadow: 0 0 15px var(--primary);
            border-bottom: 4px solid var(--accent); display: inline-block;
        }

        /* HEADER AREA */
        .page-header {
            height: 40vh; min-height: 300px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(0,240,255,0.1) 0%, #050505 80%);
            border-bottom: 2px solid var(--primary); margin-bottom: 50px;
        }
        .page-title {
            font-family: 'Kanit', sans-serif; font-size: clamp(3.5rem, 10vw, 8rem);
            font-style: italic; font-weight: 900; line-height: 0.9; letter-spacing: 0.03em; color: #ffffff;
            text-align: center; transform: skewX(-5deg); -webkit-text-stroke: 2px #000000;
            text-shadow: 4px 4px 0 #000000, 8px 8px 0 var(--primary), 12px 12px 0 var(--accent), 0 0 40px rgba(0, 240, 255, 0.4);
            margin-bottom: 20px;
        }
        .page-title span {
            display: block; font-family: var(--font-jp-head); font-style: normal; font-weight: 400;
            font-size: clamp(1.2rem, 3vw, 2rem); margin-top: 25px; letter-spacing: 0.2em; transform: skewX(5deg);
            color: #fff; -webkit-text-stroke: 1px #000; text-shadow: 3px 3px 0 rgba(0,0,0,0.8);
            background: none; -webkit-background-clip: border-box; opacity: 1;
        }

        /* MEMBER LIST */
        .member-list { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; }
        .member-card {
            background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.3);
            padding: 15px 5px; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
        }
        .member-card:hover { background: rgba(0,240,255,0.15); border-color: var(--yellow); transform: translateY(-5px); }
        .member-icon {
            width: 80px; height: 80px; background: #333; border-radius: 50%; margin-bottom: 10px;
            border: 3px solid white; display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .member-icon img { width: 100%; height: 100%; object-fit: cover; }
        .member-name { font-weight: bold; color: var(--primary); font-size: 1rem; margin-bottom: 10px; line-height: 1.2; }
        .cat-badge {
            font-size: 0.75rem; padding: 2px 10px; border-radius: 12px;
            color: white; font-weight: bold; margin-bottom: 15px; display: inline-block; letter-spacing: 1px;
        }
        .cat-invite { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
        .cat-aoharu { background: var(--primary); color: black; box-shadow: 0 0 5px var(--primary); }
        .cat-admin { background: var(--yellow); color: black; box-shadow: 0 0 5px var(--yellow); }
        .cat-participant { background: #333; border: 1px solid #555; }
        .member-links { display: flex; gap: 10px; justify-content: center; }
        .sns-btn {
            width: 30px; height: 30px; border-radius: 50%; background: #222; color: white;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            transition: 0.3s; border: 1px solid #444; font-size: 1rem;
        }
        .sns-btn:hover { transform: scale(1.1); }
        .sns-youtube:hover { background: #ff0000; border-color: #ff0000; }
        .sns-twitch:hover { background: #9146ff; border-color: #9146ff; }
        .sns-tiktok:hover { background: #000000; border-color: #25F4EE; box-shadow: 2px 2px 0 #FE2C55, -2px -2px 0 #25F4EE; }
        .sns-twitter:hover { background: #000; border-color: white; }

        /* PARTNERS */
        .sponsor-card {
            background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 40px; padding: 30px; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .sponsor-card:hover { border-color: var(--primary); box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); }
        .sp-name {
            font-family: var(--font-jp-head); font-size: 1.8rem; color: white;
            margin-bottom: 20px; border-left: 5px solid var(--accent); padding-left: 15px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .sp-rank {
            font-family: var(--font-en); font-size: 1rem; background: var(--yellow); color: black;
            padding: 2px 10px; transform: skewX(-10deg); font-weight: bold;
        }
        /* 企業HPリンクボタン */
        .sp-link-btn {
            font-family: var(--font-en); font-size: 1rem; color: var(--primary); border: 1px solid var(--primary);
            padding: 2px 15px; border-radius: 20px; text-decoration: none; margin-left: auto;
            display: flex; align-items: center; gap: 5px; transition: 0.3s; background: rgba(0, 240, 255, 0.1);
        }
        .sp-link-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 10px var(--primary); }

        .sp-content { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; align-items: flex-start; }
        .sp-left-col { display: flex; flex-direction: column; gap: 20px; }
        .sp-logo-area {
            background: white; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
            border-radius: 5px; padding: 20px;
        }
        .sp-logo-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .sp-item-box {
            background: rgba(255,255,255,0.05); border: 1px dashed var(--text-dim); padding: 15px;
            display: flex; gap: 15px; align-items: center;
        }
        .sp-item-thumb { width: 80px; height: 80px; background: #000; border: 1px solid #555; object-fit: cover; flex-shrink: 0; }
        .sp-item-text { font-size: 0.9rem; color: var(--text-dim); }
        .sp-item-text .item-label { display: block; font-size: 0.8rem; color: #fff; margin-bottom: 2px; }
        .sp-item-text strong { display: block; color: var(--yellow); font-size: 1.1rem; line-height: 1.3; }
        .sp-video-area {
            position: relative; width: 100%; padding-bottom: 56.25%;
            background: black; border: 1px solid #333;
        }
        .sp-video-area iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* GALLERY */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .gallery-item {
            position: relative; aspect-ratio: 16/9; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
            background: #111; cursor: pointer; transition: 0.3s;
        }
        .gallery-item:hover { transform: scale(1.02); border-color: var(--yellow); z-index: 2; box-shadow: 0 0 20px rgba(252,238,10,0.3); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item:hover img { opacity: 0.8; }

        /* CREDITS */
        .credit-list { list-style: none; border-top: 1px solid rgba(255,255,255,0.2); }
        .credit-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .credit-item:hover { background: rgba(255,255,255,0.03); padding-left: 20px; border-color: var(--primary); }
        .cr-left { display: flex; align-items: center; gap: 15px; }
        .cr-type {
            font-size: 0.8rem; padding: 2px 8px; border-radius: 3px; font-family: var(--font-en);
            min-width: 60px; text-align: center; font-weight: bold;
            background: #333; color: #ccc; border: 1px solid #555;
        }
        .cr-type[data-type="MOD"] { background: rgba(0, 240, 255, 0.2); color: var(--primary); border-color: var(--primary); }
        .cr-type[data-type="BGM"] { background: rgba(252, 238, 10, 0.2); color: var(--yellow); border-color: var(--yellow); }
        .cr-type[data-type="WORLD"] { background: rgba(255, 0, 85, 0.2); color: var(--accent); border-color: var(--accent); }
        .cr-name { font-weight: bold; color: white; font-size: 1.1rem; }
        .cr-link { 
            color: var(--text-dim); font-size: 0.9rem; text-decoration: none; 
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .cr-link:hover { color: var(--primary); text-decoration: underline; }

        .back-btn {
            display: inline-block; padding: 15px 40px; margin: 50px 0;
            border: 1px solid var(--text-dim); color: var(--text-main); text-decoration: none;
            font-family: var(--font-en); font-size: 1.2rem; transition: 0.3s;
        }
        .back-btn:hover { background: white; color: black; border-color: white; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .page-title { font-size: 2rem; -webkit-text-stroke: 1px #000; }
            .member-list { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .member-card { padding: 10px 5px; }
            .member-icon { width: 55px; height: 55px; margin-bottom: 5px; border-width: 2px; }
            .member-name { font-size: 0.7rem; margin-bottom: 3px; word-wrap: break-word; }
            .cat-badge { font-size: 0.6rem; padding: 1px 6px; margin-bottom: 5px; white-space: nowrap; transform: scale(0.9); }
            .member-links { gap: 4px; }
            .sns-btn { width: 24px; height: 24px; font-size: 0.8rem; border-width: 0; }
            
            .sp-content { grid-template-columns: 1fr; gap: 20px; }
            .sp-name { font-size: 1.4rem; align-items: flex-start; }
            .sp-link-btn { margin-left: 0; margin-top: 5px; font-size: 0.9rem; }
            
            .credit-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .cr-link { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <div class="bg-grid-base"></div>

    <header class="page-header">
        <h1 class="page-title">EVENT INFO & GALLERY<br><span>イベント詳細情報</span></h1>
    </header>

    <section class="container" style="margin-bottom: 100px;">
        <div class="section-header">
            <div class="section-en">MEMBER</div>
            <div class="section-jp">参加者一覧</div>
        </div>
        <div class="member-list" id="memberListArea">
            <p style="text-align:center; color:white; width:100%;">Loading Members...</p>
        </div>
    </section>

    <section class="container narrow-box" style="margin-bottom: 100px;">
        <div class="section-header">
            <div class="section-en">PARTNERS</div>
            <div class="section-jp">協賛・CM・提供</div>
        </div>
        <div id="partnersArea">
            <p style="text-align:center; color:white;">Loading Partners...</p>
        </div>
    </section>

    <section class="container narrow-box" style="margin-bottom: 100px;">
        <div class="section-header">
            <div class="section-en">GALLERY</div>
            <div class="section-jp">イベント風景</div>
        </div>
        <div class="gallery-grid" id="galleryArea">
            <p style="text-align:center; color:white; width:100%;">Loading Gallery...</p>
        </div>
    </section>

    <section class="container narrow-box" style="margin-bottom: 100px;">
        <div class="section-header">
            <div class="section-en">CREDITS</div>
            <div class="section-jp">使用素材・MOD</div>
        </div>
        <ul class="credit-list" id="creditsArea">
            <p style="text-align:center; color:white;">Loading Credits...</p>
        </ul>
    </section>

    <div style="text-align: center; padding-bottom: 100px;">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> BACK TO TOP</a>
        <p style="margin-top:30px; font-family:var(--font-en); letter-spacing:2px; font-size:0.9rem; color:rgba(255,255,255,0.5);">© 2026 AOHARU FRIENDS PROJECT</p>
    </div>

    <script>
        // ★★★重要：ここにGASのウェブアプリURLを貼り付けてください！★★★
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyQk44uCG1830bOuRAJPzFDL0jfOReWdRleIfDyA7A9A2rVx4P6f2JQZN3al4oTZrhU/exec'; 

        document.addEventListener('DOMContentLoaded', () => {
            const memberArea = document.getElementById('memberListArea');
            const galleryArea = document.getElementById('galleryArea');
            const partnersArea = document.getElementById('partnersArea');
            const creditsArea = document.getElementById('creditsArea');

            fetch(GAS_URL)
            .then(response => response.json())
            .then(data => {
                // ==========================
                // 1. MEMBER
                // ==========================
                memberArea.innerHTML = '';
                if(data.members && data.members.length > 0) {
                    data.members.forEach(member => {
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        const iconUrl = member.icon ? member.icon : 'https://placehold.jp/333333/ffffff/150x150.png?text=NO+IMG';
                        
                        let catClass = 'cat-participant'; 
                        const catText = member.category ? member.category.trim() : '参加者';
                        if(catText === '特別招待') catClass = 'cat-invite';
                        else if(catText === 'あおはる☆フレンズ') catClass = 'cat-aoharu';
                        else if(catText === '運営') catClass = 'cat-admin';

                        let linksHtml = '';
                        if(member.platformType && member.platformUrl) {
                            let iconClass = ''; let btnClass = '';
                            const pType = member.platformType.trim();
                            if(pType === 'YouTube') { iconClass = 'fa-youtube'; btnClass = 'sns-youtube'; }
                            else if(pType === 'Twitch') { iconClass = 'fa-twitch'; btnClass = 'sns-twitch'; }
                            else if(pType === 'TikTok') { iconClass = 'fa-tiktok'; btnClass = 'sns-tiktok'; }
                            if(iconClass) {
                                linksHtml += `<a href="${member.platformUrl}" target="_blank" class="sns-btn ${btnClass}"><i class="fab ${iconClass}"></i></a>`;
                            }
                        }
                        if(member.twitterUrl) {
                            linksHtml += `<a href="${member.twitterUrl}" target="_blank" class="sns-btn sns-twitter"><i class="fab fa-x-twitter"></i></a>`;
                        }

                        card.innerHTML = `
                            <div class="member-icon"><img src="${iconUrl}" alt="${member.name}" loading="lazy"></div>
                            <div class="member-name">${member.name}</div>
                            <span class="cat-badge ${catClass}">${catText}</span>
                            <div class="member-links">${linksHtml}</div>
                        `;
                        memberArea.appendChild(card);
                    });
                } else {
                    memberArea.innerHTML = '<p style="color:white; grid-column:1/-1; text-align:center;">現在、参加者はいません。</p>';
                }

                // ==========================
                // 2. PARTNERS (Link Button Added)
                // ==========================
                partnersArea.innerHTML = '';
                if(data.partners && data.partners.length > 0) {
                    data.partners.forEach(partner => {
                        const pCard = document.createElement('div');
                        pCard.className = 'sponsor-card';

                        let videoHtml = '';
                        if(partner.videoUrl) {
                            let videoId = '';
                            const url = partner.videoUrl;
                            if(url.includes('youtube.com/watch?v=')) {
                                videoId = url.split('v=')[1].split('&')[0];
                            } else if(url.includes('youtu.be/')) {
                                videoId = url.split('youtu.be/')[1].split('?')[0];
                            }
                            if(videoId) {
                                videoHtml = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}?controls=1" title="Partner Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                            }
                        } else {
                             videoHtml = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#555;">No Video</div>';
                        }

                        let itemHtml = '';
                        if(partner.itemName) {
                             const itemImg = partner.itemImage ? partner.itemImage : 'https://placehold.jp/333333/ffffff/100x100.png?text=NO+IMG';
                             itemHtml = `
                                <div class="sp-item-box">
                                    <img src="${itemImg}" alt="${partner.itemName}" class="sp-item-thumb">
                                    <div class="sp-item-text">
                                        <span class="item-label">${partner.prizeType || '提供賞品'}</span>
                                        <strong>${partner.itemName}</strong>
                                    </div>
                                </div>
                             `;
                        }

                        // 企業HPリンクボタンの作成
                        let linkBtnHtml = '';
                        if(partner.website) {
                            linkBtnHtml = `<a href="${partner.website}" target="_blank" class="sp-link-btn">OFFICIAL SITE <i class="fas fa-external-link-alt"></i></a>`;
                        }

                        const logoSrc = partner.logo ? partner.logo : 'https://placehold.jp/ffffff/000000/400x200.png?text=LOGO';

                        pCard.innerHTML = `
                            <div class="sp-name">
                                <div>${partner.company} <span class="sp-rank">${partner.rank || 'SPONSOR'}</span></div>
                                ${linkBtnHtml}
                            </div>
                            <div class="sp-content">
                                <div class="sp-left-col">
                                    <div class="sp-logo-area">
                                        <img src="${logoSrc}" alt="${partner.company}" loading="lazy">
                                    </div>
                                    ${itemHtml}
                                </div>
                                <div class="sp-video-area">
                                    ${videoHtml}
                                </div>
                            </div>
                        `;
                        partnersArea.appendChild(pCard);
                    });
                } else {
                    partnersArea.innerHTML = '<p style="color:#aaa; text-align:center;">現在、パートナー情報はありません。</p>';
                }

                // ==========================
                // 3. GALLERY
                // ==========================
                galleryArea.innerHTML = '';
                if(data.gallery && data.gallery.length > 0) {
                    data.gallery.forEach(item => {
                        if(!item.url) return;
                        const gItem = document.createElement('div');
                        gItem.className = 'gallery-item';
                        const img = document.createElement('img');
                        img.src = item.url;
                        img.alt = item.caption || 'Event Photo';
                        img.loading = 'lazy';
                        gItem.appendChild(img);
                        galleryArea.appendChild(gItem);
                    });
                } else {
                    galleryArea.innerHTML = '<p style="color:#aaa; grid-column:1/-1; text-align:center;">写真がまだありません。</p>';
                }

                // ==========================
                // 4. CREDITS
                // ==========================
                creditsArea.innerHTML = '';
                if(data.credits && data.credits.length > 0) {
                    data.credits.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'credit-item';
                        const typeText = item.type || 'ETC';
                        li.innerHTML = `
                            <div class="cr-left">
                                <span class="cr-type" data-type="${typeText}">${typeText}</span>
                                <span class="cr-name">${item.name}</span>
                            </div>
                            <a href="${item.url || '#'}" target="_blank" class="cr-link">
                                ${item.label || 'Link'} <i class="fas fa-external-link-alt"></i>
                            </a>
                        `;
                        creditsArea.appendChild(li);
                    });
                } else {
                    creditsArea.innerHTML = '<p style="color:#aaa; text-align:center;">情報がありません。</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const errorMsg = '<p style="color:red; text-align:center; width:100%;">読み込みに失敗しました。</p>';
                memberArea.innerHTML = errorMsg;
                galleryArea.innerHTML = errorMsg;
                partnersArea.innerHTML = errorMsg;
                creditsArea.innerHTML = errorMsg;
            });
        });
    </script>
</body>
</html>
